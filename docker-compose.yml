# AfghanFood.de - Docker Compose Konfiguration
# Vollständige Self-Hosting Lösung

version: '3.8'

services:
  # MongoDB Datenbank
  mongodb:
    image: mongo:7
    container_name: afghanfood-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
      - ./seed:/docker-entrypoint-initdb.d:ro
    environment:
      - MONGO_INITDB_DATABASE=afghanfood
    networks:
      - afghanfood-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afghanfood-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=afghanfood
      - JWT_SECRET=${JWT_SECRET:-afghanfood-secret-key-production-2024}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - afghanfood-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=${BACKEND_URL:-http://localhost:8001}
    container_name: afghanfood-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - afghanfood-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: afghanfood-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - afghanfood-network

networks:
  afghanfood-network:
    driver: bridge

volumes:
  mongodb_data:
